services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: klivexa
      POSTGRES_PASSWORD: klivexa_local
      POSTGRES_DB: klivexa
    ports:
      - "5432:5432"
    volumes:
      - klivexa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klivexa -d klivexa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - klivexa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  klivexa_postgres:
  klivexa_redis:
